[project]
name = "tokenjsp"
version = "0.1.0"
description = "TokenJSP: Graph Representation Learning for Job Shop Scheduling Problems"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "scipy",
    "torch",
    "gymnasium",
    "stable-baselines3",
    "sb3-contrib",
    "torch-geometric",
    "wandb",
    "scikit-learn",
    "graph-jsp-env",
]

authors = [
    { name = "Ziya Valiyev" }
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}