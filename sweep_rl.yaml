program: scripts/rl_train.py
method: bayes

metric:
  name: val/makespan
  goal: minimize

parameters:
  gamma:
    values: [0.99, 0.995]

  ent_coef:
    values: [0.0, 0.01]

command:
  - ${env}
  - python
  - ${program}
  - --train_data
  - datasets/rl_dataset_jsp_10x10.npz
  - --val_data
  - datasets/rl_dataset_test_jsp_10x10.npz
  - --encoder_weights
  - weights/encoder_10x10_baseline.pt
  - --run_name
  - sweep_test
  - --use_wandb