program: scripts/gae_mixed_train.py
method: bayes

metric:
  name: test/ap_average
  goal: maximize

parameters:
  model:
    values: ["gae", "vgae"]

  weight_decay:
    values: [0, 1e-5]

  gnn_type:
    values: ["gcn", "egc", "gin", "pna", "gat", "gatv2"]
  
  latent_channels:
    values: [16, 32, 64]

  hidden_channels:
    values: [32, 64]

  batch_size:
    values: [32, 64]

command:
  - ${env}
  - python
  - ${program}
  - --data_10
  - datasets/gae_dataset_jsp_10x10.npz
  - --data_15
  - datasets/gae_dataset_jsp_15x15.npz
  - --data_20
  - datasets/gae_dataset_jsp_20x20.npz
  - --run_name
  - gae_sweep
  - --use_wandb